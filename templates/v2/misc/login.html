{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — ENSMG Comptabilité des Matières</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0e1320;--surface2:#131829;--surface3:#1a2240;
  --border:rgba(255,255,255,.065);--border-h:rgba(255,255,255,.13);--border-focus:rgba(82,183,255,.55);
  --t1:#f0f4ff;--t2:#7e8fa8;--t3:#3d4f68;
  --accent:#52b7ff;--accent-d:rgba(82,183,255,.11);
  --green:#4ade9a;
  --red:#f87171;--red-d:rgba(248,113,113,.11);
  --r:16px;--rs:10px;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 65% 45% at 75% -5%,rgba(82,183,255,.07) 0%,transparent 60%),
             radial-gradient(ellipse 45% 35% at 5% 95%,rgba(74,222,154,.05) 0%,transparent 55%)}

.login-wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:16px;animation:fup .4s var(--ease) both}
@keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.login-logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:32px}
.login-logo-ico{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#050810;box-shadow:0 4px 20px rgba(82,183,255,.35)}
.login-logo-text .main{font-size:16px;font-weight:800;color:var(--t1)}
.login-logo-text .sub{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}

.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:28px 28px 24px;box-shadow:0 16px 56px rgba(0,0,0,.45)}
.login-title{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--t2);margin-bottom:24px}

.fld{margin-bottom:16px}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.fld input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 13px;font-family:var(--font);font-size:13px;color:var(--t1);outline:none;transition:border-color .15s,box-shadow .15s}
.fld input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(82,183,255,.1)}
.fld input::placeholder{color:var(--t3)}

.btn-login{width:100%;padding:11px;background:var(--accent);color:#050810;border:none;border-radius:var(--rs);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .18s var(--ease);margin-top:8px;box-shadow:0 2px 14px rgba(82,183,255,.28)}
.btn-login:hover{background:#74c8ff;box-shadow:0 4px 22px rgba(82,183,255,.4);transform:translateY(-1px)}
.btn-login:active{transform:translateY(0)}

.alert{padding:10px 13px;border-radius:var(--rs);font-size:12px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.alert-error{background:var(--red-d);border:1px solid rgba(248,113,113,.2);color:var(--red)}
.alert svg{flex-shrink:0}

.login-footer{text-align:center;margin-top:20px;font-size:10.5px;color:var(--t3)}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-ico">CM</div>
    <div class="login-logo-text">
      <div class="main">ENSMG</div>
      <div class="sub">Comptabilité des Matières</div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-title">Connexion</div>
    <div class="login-sub">Entrez vos identifiants pour accéder à l'application.</div>

    {% if messages %}
    {% for msg in messages %}
    <div class="alert alert-error">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ msg }}
    </div>
    {% endfor %}
    {% endif %}

    <form method="post" autocomplete="on">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="fld">
        <label for="id_username">Identifiant</label>
        <input type="text" id="id_username" name="username" value="{{ username|default:'' }}" placeholder="Nom d'utilisateur" autofocus autocomplete="username">
      </div>
      <div class="fld">
        <label for="id_password">Mot de passe</label>
        <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Se connecter</button>
    </form>
  </div>

  <div class="login-footer">ENSMG &mdash; Système de gestion interne</div>
</div>
</body>
</html>
